name: 'C++ CI'

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Версии ОС закреплены: ubuntu-24.04 - как в devcontainer,
          # windows-2022 - на нём Visual Studio 2022 из пресетов.
          - { os: ubuntu-24.04, preset: default }
          - { os: ubuntu-24.04, preset: asan }
          - { os: ubuntu-24.04, preset: ubsan }
          - { os: windows-2022, preset: windows-default }
          - { os: windows-2022, preset: windows-asan }

    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Ninja
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

       - name: Upload exe
       if: ${{ always() && runner.os == 'Windows' }}
       uses: actions/upload-artifact@v4
       with:
         name: lab1-${{ matrix.preset }}
         path: |
           build/${{ matrix.preset }}/Debug/lab1.exe
           build/${{ matrix.preset }}/Debug/*.dll
         if-no-files-found: error
